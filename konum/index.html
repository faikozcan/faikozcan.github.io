<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Konum Kaydedici</title>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085;
    --line: #e4e7ec; --accent: #1f6feb; --danger: #d92d20; --ok: #12b76a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --line: #30363d; --accent: #4493f8; --danger: #f85149; --ok: #3fb950;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 20px 0 12px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  label { color: var(--muted); font-size: .9rem; }
  select, button, a.btn {
    font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 10px 14px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.stop { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .big { width: 100%; padding: 14px; font-size: 1.05rem; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem; margin-top: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: .95rem; margin-top: 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); padding: 12px 0; }
  li:first-child { border-top: 0; }
  .when { font-weight: 600; }
  .coords { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; word-break: break-all; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .actions a.btn, .actions button { padding: 6px 10px; font-size: .85rem; }
  .actions a.btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>📍 Konum Kaydedici</h1>

  <section class="card">
    <div class="row">
      <div class="grow">
        <label for="interval">Kayıt aralığı</label><br>
        <select id="interval">
          <option value="60">1 dakika</option>
          <option value="300">5 dakika</option>
          <option value="900" selected>15 dakika</option>
          <option value="1800">30 dakika</option>
          <option value="3600">1 saat</option>
        </select>
      </div>
      <button id="now">Şimdi kaydet</button>
    </div>
    <button id="toggle" class="primary big" style="margin-top:12px">Kaydı başlat</button>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Durduruldu</span></div>
    <label class="check"><input type="checkbox" id="wake"> Ekranı açık tut (daha güvenilir kayıt)</label>
    <p class="hint">Veriler yalnızca bu cihazda saklanır, hiçbir sunucuya gönderilmez.
      Tarayıcılar arka planda konuma izin vermediği için kayıt, uygulama ekranda açıkken yapılır.</p>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 class="grow" style="margin:0">Kayıtlar <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    </div>
    <div class="toolbar" style="margin-bottom:12px">
      <button id="route">Rotayı haritada aç</button>
      <button id="gpx">GPX indir</button>
      <button id="csv">CSV indir</button>
      <button id="clear" class="danger">Tümünü sil</button>
    </div>
    <ul id="list"></ul>
  </section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
